t · booking starts opening Friday at 12:00</text><a href="a-plan.svg" aria-label="Practice plan"><text x="252" y="532" font-size="14" fill="#0868D9" font-weight="600" text-anchor="start">View plan</text></a><text x="232" y="595" font-size="19" fill="#667080" font-weight="600" text-anchor="start" text-decoration="line-through">Saturday 12 September</text><text x="232" y="622" font-size="13" fill="#667080" font-weight="400" text-anchor="start">Booking off · existing bookings remain visible</text><text x="232" y="668" font-size="19" fill="#B73332" font-weight="600" text-anchor="start" text-decoration="line-through">Sunday 20 September</text><text x="232" y="695" font-size="13" fill="#B73332" font-weight="400" text-anchor="start">Practice rooms closed</text><text x="859.92" y="202" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">This week</text><text x="859.92" y="251" font-size="30" fill="#1D2430" font-weight="600" text-anchor="start">12 hours</text><text x="859.92" y="279" font-size="13" fill="#667080" font-weight="400" text-anchor="start">booked · 7–13 September</text><path d="M859.92 304h300.08000000000004" stroke="#E1E6EE" fill="none"/><text x="859.92" y="331" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Planned sessions are possible future bookings.</text><text x="859.92" y="352" font-size="14" fill="#667080" font-weight="400" text-anchor="start">They are not included in booked hours.</text><a href="a-calendar.svg" aria-label="Open calendar"><rect x="859.92" y="415" width="300.08000000000004" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="1009.96" y="441.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Open calendar</text></a></svg>