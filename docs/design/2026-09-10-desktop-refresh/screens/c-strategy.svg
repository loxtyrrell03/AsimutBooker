iting may leave part of your daily target unfilled. Each booking uses fresh availability.</text><path d="M120 671h1040" stroke="#E1E6EE" fill="none"/><text x="120" y="706" font-size="12" fill="#667080" font-weight="400" text-anchor="start">Unsaved changes</text><a href="c-settings.svg" aria-label="Discard"><rect x="902" y="685" width="104" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="954.0" y="711.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Discard</text></a><a href="c-settings.svg" aria-label="Save changes"><rect x="1018" y="685" width="142" height="42" rx="11" fill="#0868D9"/><text x="1089.0" y="711.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Save changes</text></a></svg>