<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, sans-serif"><title>C · Week workspace · Events &amp; protected time</title><desc>Design proposal. All values are invented examples. Local links navigate static mockups only.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F8FAFC"/><rect x="0" y="0" width="1200" height="34" rx="0" fill="#FFFFFF"/><text x="18" y="23" font-size="12" fill="#667080" font-weight="400" text-anchor="start">Asimut Booker</text><path d="M1086 17h12" stroke="#667080" fill="none"/><rect x="1128" y="12" width="10" height="10" rx="0" fill="#FFFFFF" stroke="#667080" stroke-width="1"/><path transform="translate(1166 8) scale(0.7916666666666666)" d="M6 6L18 18M6 18L18 6" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M0 34h1200" stroke="#E1E6EE" fill="none"/><rect x="0" y="35" width="88" height="765" rx="0" fill="#FFFFFF"/><rect x="26" y="62" width="36" height="36" rx="11" fill="#0868D9"/><rect x="34" y="78" width="4" height="11" rx="2" fill="#FFFFFF"/><rect x="41" y="68" width="4" height="21" rx="2" fill="#FFFFFF"/><rect x="48" y="74" width="4" height="15" rx="2" fill="#FFFFFF"/><a href="c-today.svg" aria-label="Today"><path transform="translate(34 143) scale(0.875)" d="M3 10L12 3L21 10V21H15V14H9V21H3Z" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="44.0" y="183" font-size="11" fill="#667080" font-weight="400" text-anchor="middle">Today</text></a><a href="c-week.svg" aria-label="My Week"><path transform="translate(34 219) scale(0.875)" d="M9 6H21M9 12H21M9 18H21M3 6H4M3 12H4M3 18H4" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="44.0" y="259" font-size="11" fill="#667080" font-weight="400" text-anchor="middle">My Week</text></a><a href="c-calendar.svg" aria-label="Calendar"><path transform="translate(34 295) scale(0.875)" d="M5 5H19Q21 5 21 7V20H3V7Q3 5 5 5M7 3V7M17 3V7M3 10H21M7 14H9M15 14H17M7 17H9" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="44.0" y="335" font-size="11" fill="#667080" font-weight="400" text-anchor="middle">Calendar</text></a><a href="c-assistant.svg" aria-label="Assistant"><path transform="translate(34 371) scale(0.875)" d="M4 4H20V17H10L4 21Z" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="44.0" y="411" font-size="11" fill="#667080" font-weight="400" text-anchor="middle">Assistant</text></a><a href="c-settings.svg" aria-label="Settings"><rect x="12" y="668" width="64" height="62" rx="13" fill="#EAF3FF"/><path transform="translate(34 677) scale(0.875)" d="M3 6H8M12 6H21M3 12H15M19 12H21M3 18H5M9 18H21M8 3V9M15 9V15M5 15V21" stroke="#0868D9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="44.0" y="717" font-size="11" fill="#0868D9" font-weight="600" text-anchor="middle">Settings</text></a><path d="M88 35V800" stroke="#E1E6EE"/><text x="120" y="120" font-size="32" fill="#1D2430" font-weight="600" text-anchor="start">Events &amp; protected time</text><text x="120" y="150" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Settings</text><path d="M120 756h1040" stroke="#E1E6EE" fill="none"/><text x="120" y="780" font-size="11" fill="#667080" font-weight="400" text-anchor="start">C · Week workspace   /   Design preview · invented example data</text><text x="120" y="203" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Calendar conflicts</text><a href="c-confirmations.svg" aria-label="Chamber music · Thursday 10 · 15:00–16:00"><text x="120" y="242" font-size="16" fill="#1D2430" font-weight="600" text-anchor="start">Chamber music · Thursday 10 · 15:00–16:00</text><text x="120" y="266" font-size="13" fill="#667080" font-weight="400" text-anchor="start">Recital room · respected when finding practice</text><path transform="translate(1138 234) scale(0.75)" d="M9 5L16 12L9 19" stroke="#0868D9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M120 284h1040" stroke="#E1E6EE" fill="none"/></a><rect x="120" y="304" width="1040" height="106" rx="14" fill="#FFF8ED"/><text x="138" y="332" font-size="16" fill="#93620C" font-weight="600" text-anchor="start">Ignoring an event allows overlapping bookings</text><text x="138" y="356" font-size="14" fill="#93620C" font-weight="400" text-anchor="start">Only ignore an event when you no longer need that time kept free.</text><text x="138" y="393" font-size="14" fill="#93620C" font-weight="600" text-anchor="start">Review event choice</text><text x="120" y="459" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Protected time</text><a href="c-confirmations.svg" aria-label="Friday 11 September · 09:00–10:00"><text x="120" y="505" font-size="16" fill="#1D2430" font-weight="600" text-anchor="start">Friday 11 September · 09:00–10:00</text><text x="120" y="529" font-size="13" fill="#667080" font-weight="400" text-anchor="start">Protected after cancellation · no automatic rebooking</text><path transform="translate(1138 497) scale(0.75)" d="M9 5L16 12L9 19" stroke="#0868D9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M120 547h1040" stroke="#E1E6EE" fill="none"/></a><a href="c-confirmations.svg" aria-label="Reopen selected time"><rect x="120" y="577" width="195" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="217.5" y="603.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Reopen selected time</text></a><text x="120" y="659" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Reopening permits future bookings. It does not restore a cancelled reservation.</text></svg>