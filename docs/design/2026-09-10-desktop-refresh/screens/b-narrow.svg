ill="#0868D9" font-weight="600" text-anchor="middle">Settings</text></a><path d="M0 117h760" stroke="#E1E6EE" fill="none"/><text x="32" y="150" font-size="32" fill="#1D2430" font-weight="600" text-anchor="start">Daily target &amp; times</text><text x="32" y="180" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Default practice preferences</text><path d="M32 756h696" stroke="#E1E6EE" fill="none"/><text x="32" y="780" font-size="11" fill="#667080" font-weight="400" text-anchor="start">B · Open canvas   /   Design preview · invented example data</text><rect x="32" y="208" width="696" height="397" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="56" y="245" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Daily target</text><rect x="56" y="257" width="312.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="68" y="284" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">3 hours</text><text x="392.0" y="245" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Applies to</text><rect x="392.0" y="257" width="312.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="404.0" y="284" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">Enabled practice dates</text><path d="M56 321h648" stroke="#E1E6EE" fill="none"/><text x="56" y="359" font-size="18" fill="#1D2430" font-weight="600" text-anchor="start">Preferred times</text><text x="56" y="396" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">From</text><rect x="56" y="408" width="312.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="68" y="435" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">12:00</text><text x="392.0" y="396" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Until</text><rect x="392.0" y="408" width="312.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="404.0" y="435" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">20:00</text><text x="56" y="495" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">Only book within these times</text><rect x="660" y="474" width="44" height="26" rx="13" fill="#E1E6EE"/><rect x="663" y="477" width="20" height="20" rx="10" fill="#FFFFFF"/><text x="56" y="537" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Flexible times favour this window. If no suitable room is available, your target can remain unfilled.</text><rect x="295" y="470" width="32" height="32" rx="16" fill="#FFFFFF" stroke="#0868D9" stroke-width="1"/><text x="311" y="492" font-size="16" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><rect x="50" y="613" width="660" height="89" rx="14" fill="#EAF3FF" stroke="#0868D9" stroke-width="1"/><text x="66" y="639" font-size="14" fill="#0868D9" font-weight="600" text-anchor="start">Strict preferred times</text><text x="66" y="662" font-size="13" fill="#0868D9" font-weight="400" text-anchor="start">When on, rooms outside this window will not be booked. Escape closes this help.</text><path d="M32 709h696" stroke="#E1E6EE" fill="none"/><text x="32" y="744" font-size="12" fill="#667080" font-weight="400" text-anchor="start">Unsaved changes</text><a href="b-settings.svg" aria-label="Discard"><rect x="470" y="723" width="104" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="522.0" y="749.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Discard</text></a><a href="b-settings.svg" aria-label="Save changes"><rect x="586" y="723" width="142" height="42" rx="11" fill="#0868D9"/><text x="657.0" y="749.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Save changes</text></a></svg>