weight="600" text-anchor="start">Preferred time</text><rect x="416" y="394" width="744" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="428" y="421" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">Custom · 12:00–20:00</text><text x="416" y="486" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">Only book within these times</text><rect x="1116" y="465" width="44" height="26" rx="13" fill="#E1E6EE"/><rect x="1119" y="468" width="20" height="20" rx="10" fill="#FFFFFF"/><rect x="416" y="520" width="744" height="106" rx="14" fill="#EAF3FF"/><text x="434" y="548" font-size="16" fill="#0868D9" font-weight="600" text-anchor="start">Existing bookings stay in place</text><text x="434" y="572" font-size="14" fill="#0868D9" font-weight="400" text-anchor="start">Turning booking off prevents new bookings. It does not cancel reservations.</text><path d="M120 675h1040" stroke="#E1E6EE" fill="none"/><text x="120" y="710" font-size="12" fill="#667080" font-weight="400" text-anchor="start">Unsaved changes</text><a href="c-calendar.svg" aria-label="Discard"><rect x="902" y="689" width="104" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="954.0" y="715.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Discard</text></a><a href="c-calendar.svg" aria-label="Save 2 dates"><rect x="1018" y="689" width="142" height="42" rx="11" fill="#0868D9"/><text x="1089.0" y="715.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Save 2 dates</text></a></svg>