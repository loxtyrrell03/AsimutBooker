<text x="762" y="1161" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">Check the outcome before a new search.</text>
<text x="762" y="1184" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">Do not submit a duplicate booking.</text>
