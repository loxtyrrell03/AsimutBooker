<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1402" viewBox="0 0 1460 1402" role="img" aria-label="Shared flow — exact events, clear scope">
<rect width="100%" height="100%" fill="#f8fafc"/>
<style>text{font-family:Segoe UI,Arial,sans-serif}</style>
<text x="24" y="42" font-size="29" font-weight="650" fill="#1d2430" text-anchor="start">Shared flow — exact events, clear scope</text>
<text x="24" y="74" font-size="15" font-weight="400" fill="#667080" text-anchor="start" data-max-width="1412">All three options use these states. A saved override and a one-off search choice have different lifetimes.</text>
<text x="24" y="98" font-size="12" font-weight="400" fill="#667080" text-anchor="start">DESIGN PREVIEW · All events, rooms, dates and outcomes are invented examples.</text>
