gs"><rect x="926" y="56" width="114" height="42" rx="12" fill="#EAF3FF"/><text x="983" y="82" font-size="14" fill="#0868D9" font-weight="600" text-anchor="middle">Settings</text></a><path d="M0 117h1200" stroke="#E1E6EE" fill="none"/><text x="132" y="150" font-size="32" fill="#1D2430" font-weight="600" text-anchor="start">Daily target &amp; times</text><text x="132" y="180" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Settings</text><path d="M132 756h936" stroke="#E1E6EE" fill="none"/><text x="132" y="780" font-size="11" fill="#667080" font-weight="400" text-anchor="start">B · Open canvas   /   Design preview · invented example data</text><rect x="132" y="208" width="936" height="397" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="156" y="245" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Daily target</text><rect x="156" y="257" width="432.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="168" y="284" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">3 hours</text><text x="612.0" y="245" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Applies to</text><rect x="612.0" y="257" width="432.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="624.0" y="284" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">Enabled practice dates</text><path d="M156 321h888" stroke="#E1E6EE" fill="none"/><text x="156" y="359" font-size="18" fill="#1D2430" font-weight="600" text-anchor="start">Preferred times</text><text x="156" y="396" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">From</text><rect x="156" y="408" width="432.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="168" y="435" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">12:00</text><text x="612.0" y="396" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Until</text><rect x="612.0" y="408" width="432.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="624.0" y="435" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">20:00</text><text x="156" y="495" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">Only book within these times</text><rect x="1000" y="474" width="44" height="26" rx="13" fill="#E1E6EE"/><rect x="1003" y="477" width="20" height="20" rx="10" fill="#FFFFFF"/><text x="156" y="537" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Flexible times favour this window. If no suitable room is available, your target can remain unfilled.</text><a href="b-dates.svg" aria-label="Edit practice dates"><a href="b-dates.svg" aria-label="Overrides for individual dates"><text x="132" y="640" font-size="16" fill="#1D2430" font-weight="600" text-anchor="start">Overrides for individual dates</text><text x="132" y="664" font-size="13" fill="#667080" font-weight="400" text-anchor="start">Set a different target or time for a specific day</text><path transform="translate(1046 632) scale(0.75)" d="M9 5L16 12L9 19" stroke="#0868D9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M132 682h936" stroke="#E1E6EE" fill="none"/></a></a><path d="M132 709h936" stroke="#E1E6EE" fill="none"/><text x="132" y="744" font-size="12" fill="#667080" font-weight="400" text-anchor="start">Unsaved changes</text><a href="b-settings.svg" aria-label="Discard"><rect x="810" y="723" width="104" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="862.0" y="749.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Discard</text></a><a href="b-settings.svg" aria-label="Save changes"><rect x="926" y="723" width="142" height="42" rx="11" fill="#0868D9"/><text x="997.0" y="749.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Save changes</text></a></svg>