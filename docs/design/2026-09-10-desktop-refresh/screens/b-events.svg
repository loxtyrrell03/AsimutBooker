<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, sans-serif"><title>B · Open canvas · Events &amp; protected time</title><desc>Design proposal. All values are invented examples. Local links navigate static mockups only.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F8FAFC"/><rect x="0" y="0" width="1200" height="34" rx="0" fill="#FFFFFF"/><text x="18" y="23" font-size="12" fill="#667080" font-weight="400" text-anchor="start">Asimut Booker</text><path d="M1086 17h12" stroke="#667080" fill="none"/><rect x="1128" y="12" width="10" height="10" rx="0" fill="#FFFFFF" stroke="#667080" stroke-width="1"/><path transform="translate(1166 8) scale(0.7916666666666666)" d="M6 6L18 18M6 18L18 6" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M0 34h1200" stroke="#E1E6EE" fill="none"/><rect x="0" y="35" width="1200" height="82" rx="0" fill="#FFFFFF"/><rect x="32" y="55" width="36" height="36" rx="11" fill="#0868D9"/><rect x="40" y="71" width="4" height="11" rx="2" fill="#FFFFFF"/><rect x="47" y="61" width="4" height="21" rx="2" fill="#FFFFFF"/><rect x="54" y="67" width="4" height="15" rx="2" fill="#FFFFFF"/><text x="80" y="79" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Asimut</text><a href="b-today.svg" aria-label="Today"><text x="487" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">Today</text></a><a href="b-week.svg" aria-label="My Week"><text x="611" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">My Week</text></a><a href="b-calendar.svg" aria-label="Calendar"><text x="735" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">Calendar</text></a><a href="b-assistant.svg" aria-label="Assistant"><text x="859" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">Assistant</text></a><a href="b-settings.svg" aria-label="Settings"><rect x="926" y="56" width="114" height="42" rx="12" fill="#EAF3FF"/><text x="983" y="82" font-size="14" fill="#0868D9" font-weight="600" text-anchor="middle">Settings</text></a><path d="M0 117h1200" stroke="#E1E6EE" fill="none"/><text x="132" y="150" font-size="32" fill="#1D2430" font-weight="600" text-anchor="start">Events &amp; protected time</text><text x="132" y="180" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Settings</text><path d="M132 756h936" stroke="#E1E6EE" fill="none"/><text x="132" y="780" font-size="11" fill="#667080" font-weight="400" text-anchor="start">B · Open canvas   /   Design preview · invented example data</text><text x="132" y="233" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Calendar conflicts</text><a href="b-confirmations.svg" aria-label="Chamber music · Thursday 10 · 15:00–16:00"><text x="132" y="272" font-size="16" fill="#1D2430" font-weight="600" text-anchor="start">Chamber music · Thursday 10 · 15:00–16:00</text><text x="132" y="296" font-size="13" fill="#667080" font-weight="400" text-anchor="start">Recital room · respected when finding practice</text><path transform="translate(1046 264) scale(0.75)" d="M9 5L16 12L9 19" stroke="#0868D9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M132 314h936" stroke="#E1E6EE" fill="none"/></a><rect x="132" y="334" width="936" height="106" rx="14" fill="#FFF8ED"/><text x="150" y="362" font-size="16" fill="#93620C" font-weight="600" text-anchor="start">Ignoring an event allows overlapping bookings</text><text x="150" y="386" font-size="14" fill="#93620C" font-weight="400" text-anchor="start">Only ignore an event when you no longer need that time kept free.</text><text x="150" y="423" font-size="14" fill="#93620C" font-weight="600" text-anchor="start">Review event choice</text><text x="132" y="489" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Protected time</text><a href="b-confirmations.svg" aria-label="Friday 11 September · 09:00–10:00"><text x="132" y="535" font-size="16" fill="#1D2430" font-weight="600" text-anchor="start">Friday 11 September · 09:00–10:00</text><text x="132" y="559" font-size="13" fill="#667080" font-weight="400" text-anchor="start">Protected after cancellation · no automatic rebooking</text><path transform="translate(1046 527) scale(0.75)" d="M9 5L16 12L9 19" stroke="#0868D9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M132 577h936" stroke="#E1E6EE" fill="none"/></a><a href="b-confirmations.svg" aria-label="Reopen selected time"><rect x="132" y="607" width="195" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="229.5" y="633.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Reopen selected time</text></a><text x="132" y="689" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Reopening permits future bookings. It does not restore a cancelled reservation.</text></svg>