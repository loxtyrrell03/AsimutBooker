<text x="1200" y="162" font-size="20" font-weight="650" fill="#1d2430" text-anchor="start">Short viewport</text>
<text x="1200" y="201" font-size="14" font-weight="400" fill="#667080" text-anchor="start" data-max-width="212">Keep the selected mode,</text>
<text x="1200" y="228" font-size="14" font-weight="400" fill="#667080" text-anchor="start" data-max-width="212">duration and action visible.</text>
<text x="1200" y="255" font-size="14" font-weight="400" fill="#667080" text-anchor="start" data-max-width="212">Allow the content to scroll.</text>
<text x="1200" y="282" font-size="14" font-weight="400" fill="#667080" text-anchor="start" data-max-width="212"></text>
<text x="1200" y="309" font-size="14" font-weight="400" fill="#667080" text-anchor="start" data-max-width="212">The sheet has a visible</text>
<text x="1200" y="336" font-size="14" font-weight="400" fill="#667080" text-anchor="start" data-max-width="212">Close control and returns</text>
<text x="1200" y="363" font-size="14" font-weight="400" fill="#667080" text-anchor="start" data-max-width="212">focus to its launcher.</text>
<text x="1200" y="390" font-size="14" font-weight="400" fill="#667080" text-anchor="start" data-max-width="212"></text>
<text x="1200" y="417" font-size="14" font-weight="400" fill="#667080" text-anchor="start" data-max-width="212">Bar reserves layout space;</text>
<text x="1200" y="444" font-size="14" font-weight="400" fill="#667080" text-anchor="start" data-max-width="212">it never covers navigation,</text>
<text x="1200" y="471" font-size="14" font-weight="400" fill="#667080" text-anchor="start" data-max-width="212">an editor or the composer.</text>
<rect x="385" y="722" width="1047" height="143" rx="16" fill="#ffffff" stroke="#e1e6ee"/>
<text x="407" y="758" font-size="22" font-weight="650" fill="#1d2430" text-anchor="start">One request, wherever you open it</text>
<text x="407" y="792" font-size="15" font-weight="400" fill="#667080" text-anchor="start" data-max-width="1003">Returning to the panel shows progress or the result; it does not submit again.</text>
<text x="407" y="814" font-size="15" font-weight="400" fill="#667080" text-anchor="start" data-max-width="1003">Duration controls stay readable at 320px. Help fits the viewport and works with touch, hover and keyboard.</text>
<text x="28" y="930" font-size="15" font-weight="400" fill="#667080" text-anchor="start">A keeps the editor at the top of Today. B opens it from the action bar. C opens it from the header.</text>
</svg>