rt">Plan ahead before choosing rooms</text><rect x="1116" y="181" width="44" height="26" rx="13" fill="#0868D9"/><rect x="1137" y="184" width="20" height="20" rx="10" fill="#FFFFFF"/><text x="232.0" y="257" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Look ahead</text><rect x="232.0" y="269" width="452.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="244.0" y="296" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">4 hours</text><rect x="661.0" y="240" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="672.0" y="256" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="708.0" y="257" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Preferred peak times</text><rect x="708.0" y="269" width="452.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="720.0" y="296" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">12:00–16:00</text><rect x="1137.0" y="240" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="1148.0" y="256" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="232.0" y="344" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Desired peak session</text><rect x="232.0" y="356" width="452.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="244.0" y="383" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">2 hours</text><rect x="661.0" y="327" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="672.0" y="343" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="708.0" y="344" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Later choices needed</text><rect x="708.0" y="356" width="452.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="720.0" y="383" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">2 suitable sessions</text><rect x="1137.0" y="327" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="1148.0" y="343" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="232.0" y="431" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Fallback lead time</text><rect x="232.0" y="443" width="452.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="244.0" y="470" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">15 minutes</text><rect x="661.0" y="414" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="672.0" y="430" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="708.0" y="431" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">After peak hours</text><rect x="708.0" y="443" width="452.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="720.0" y="470" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">Prefer suitable time</text><rect x="1137.0" y="414" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="1148.0" y="430" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="232.0" y="518" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Date order</text><rect x="232.0" y="530" width="452.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="244.0" y="557" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">Nearest eligible date first</text><rect x="661.0" y="501" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="672.0" y="517" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="708.0" y="518" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">When choices compete</text><rect x="708.0" y="530" width="452.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="720.0" y="557" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">Time fit, then room priority</text><rect x="1137.0" y="501" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="1148.0" y="517" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="232" y="621" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Waiting may leave part of your daily target unfilled. Each booking uses fresh availability.</text><path d="M232 671h928" stroke="#E1E6EE" fill="none"/><text x="232" y="706" font-size="12" fill="#667080" font-weight="400" text-anchor="start">Unsaved changes</text><a href="a-settings.svg" aria-label="Discard"><rect x="902" y="685" width="104" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="954.0" y="711.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Discard</text></a><a href="a-settings.svg" aria-label="Save changes"><rect x="1018" y="685" width="142" height="42" rx="11" fill="#0868D9"/><text x="1089.0" y="711.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Save changes</text></a></svg>