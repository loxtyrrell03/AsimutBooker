<rect x="762" y="350" width="302" height="44" rx="10" fill="#0868d9" stroke="#0868d9"/>
<text x="913.0" y="377.0" font-size="13" font-weight="650" fill="#ffffff" text-anchor="middle" data-max-width="286">Use 1 selected event</text>
<rect x="1104" y="126" width="338" height="284" rx="14" fill="#ffffff" stroke="#e1e6ee"/>
