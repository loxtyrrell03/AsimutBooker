<text x="1122" y="197" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">Allow practice during selected events.</text>
<text x="1122" y="220" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">Events stay on your calendar.</text>
<text x="1122" y="243" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">Only saved choices affect later searches.</text>
<text x="1122" y="266" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">Close × or Escape; return focus.</text>
<rect x="1122" y="350" width="302" height="44" rx="10" fill="#ffffff" stroke="#e1e6ee"/>
<text x="1273.0" y="377.0" font-size="13" font-weight="650" fill="#0868d9" text-anchor="middle" data-max-width="286">Close help</text>
