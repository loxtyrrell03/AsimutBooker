<text x="1273.0" y="1295.0" font-size="13" font-weight="650" fill="#ffffff" text-anchor="middle" data-max-width="286">Save: avoid this event</text>
<text x="24" y="1380" font-size="13" font-weight="400" fill="#667080" text-anchor="start">Phone sheets scroll above fixed actions; PC panels use the same wording and state transitions. These are proposed states, not live results.</text>
