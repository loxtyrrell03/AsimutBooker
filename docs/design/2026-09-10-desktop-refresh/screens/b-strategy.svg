 text-anchor="start">Desired peak session</text><rect x="132.0" y="386" width="456.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="144.0" y="413" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">2 hours</text><rect x="565.0" y="357" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="576.0" y="373" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="612.0" y="374" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Later choices needed</text><rect x="612.0" y="386" width="456.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="624.0" y="413" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">2 suitable sessions</text><rect x="1045.0" y="357" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="1056.0" y="373" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="132.0" y="461" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Fallback lead time</text><rect x="132.0" y="473" width="456.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="144.0" y="500" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">15 minutes</text><rect x="565.0" y="444" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="576.0" y="460" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="612.0" y="461" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">After peak hours</text><rect x="612.0" y="473" width="456.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="624.0" y="500" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">Prefer suitable time</text><rect x="1045.0" y="444" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="1056.0" y="460" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="132.0" y="548" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">Date order</text><rect x="132.0" y="560" width="456.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="144.0" y="587" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">Nearest eligible date first</text><rect x="565.0" y="531" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="576.0" y="547" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="612.0" y="548" font-size="14" fill="#1D2430" font-weight="600" text-anchor="start">When choices compete</text><rect x="612.0" y="560" width="456.0" height="42" rx="10" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="624.0" y="587" font-size="15" fill="#1D2430" font-weight="400" text-anchor="start">Time fit, then room priority</text><rect x="1045.0" y="531" width="22" height="22" rx="11" fill="#EAF3FF"/><text x="1056.0" y="547" font-size="13" fill="#0868D9" font-weight="600" text-anchor="middle">?</text><text x="132" y="651" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Waiting may leave part of your daily target unfilled. Each booking uses fresh availability.</text><path d="M132 701h936" stroke="#E1E6EE" fill="none"/><text x="132" y="736" font-size="12" fill="#667080" font-weight="400" text-anchor="start">Unsaved changes</text><a href="b-settings.svg" aria-label="Discard"><rect x="810" y="715" width="104" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="862.0" y="741.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Discard</text></a><a href="b-settings.svg" aria-label="Save changes"><rect x="926" y="715" width="142" height="42" rx="11" fill="#0868D9"/><text x="997.0" y="741.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Save changes</text></a></svg>