<text x="762" y="266" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">Saved: Seminar · 11:00–12:00</text>
<rect x="762" y="317" width="180" height="24" rx="12" fill="#eaf3ff" stroke="#eaf3ff"/>
