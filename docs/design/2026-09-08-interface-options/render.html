<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Asimut design export</title><style>html,body{margin:0;padding:0;background:#fff}svg{display:block;width:100%;height:auto}</style></head><body><script>const name=new URLSearchParams(location.search).get('screen')||'option-1';if(/^option-[123](-flow|-desktop|-phone|-desktop-detail|-phone-detail)?$/.test(name)){fetch(name+'.svg').then(r=>r.text()).then(svg=>{document.body.insertAdjacentHTML('afterbegin',svg);document.title=name;});}</script></body></html>
