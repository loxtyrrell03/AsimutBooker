<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, sans-serif"><title>B · Open canvas · Loading, empty &amp; offline</title><desc>Design proposal. All values are invented examples. Local links navigate static mockups only.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F8FAFC"/><rect x="0" y="0" width="1200" height="34" rx="0" fill="#FFFFFF"/><text x="18" y="23" font-size="12" fill="#667080" font-weight="400" text-anchor="start">Asimut Booker</text><path d="M1086 17h12" stroke="#667080" fill="none"/><rect x="1128" y="12" width="10" height="10" rx="0" fill="#FFFFFF" stroke="#667080" stroke-width="1"/><path transform="translate(1166 8) scale(0.7916666666666666)" d="M6 6L18 18M6 18L18 6" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M0 34h1200" stroke="#E1E6EE" fill="none"/><rect x="0" y="35" width="1200" height="82" rx="0" fill="#FFFFFF"/><rect x="32" y="55" width="36" height="36" rx="11" fill="#0868D9"/><rect x="40" y="71" width="4" height="11" rx="2" fill="#FFFFFF"/><rect x="47" y="61" width="4" height="21" rx="2" fill="#FFFFFF"/><rect x="54" y="67" width="4" height="15" rx="2" fill="#FFFFFF"/><text x="80" y="79" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Asimut</text><a href="b-today.svg" aria-label="Today"><text x="487" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">Today</text></a><a href="b-week.svg" aria-label="My Week"><text x="611" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">My Week</text></a><a href="b-calendar.svg" aria-label="Calendar"><text x="735" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">Calendar</text></a><a href="b-assistant.svg" aria-label="Assistant"><text x="859" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">Assistant</text></a><a href="b-settings.svg" aria-label="Settings"><rect x="926" y="56" width="114" height="42" rx="12" fill="#EAF3FF"/><text x="983" y="82" font-size="14" fill="#0868D9" font-weight="600" text-anchor="middle">Settings</text></a><path d="M0 117h1200" stroke="#E1E6EE" fill="none"/><text x="132" y="150" font-size="32" fill="#1D2430" font-weight="600" text-anchor="start">Loading, empty &amp; offline</text><text x="132" y="180" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Settings</text><path d="M132 756h936" stroke="#E1E6EE" fill="none"/><text x="132" y="780" font-size="11" fill="#667080" font-weight="400" text-anchor="start">B · Open canvas   /   Design preview · invented example data</text><rect x="132.0" y="208" width="458.0" height="251" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="152.0" y="235" font-size="10" fill="#667080" font-weight="600" text-anchor="start">LOADING</text><text x="152.0" y="270" font-size="19" fill="#0868D9" font-weight="600" text-anchor="start">Checking your bookings…</text><text x="152.0" y="309" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Your last checked bookings remain visible while this refresh runs.</text><a href="b-today.svg" aria-label="Cancel refresh"><rect x="152.0" y="397" width="418.0" height="42" rx="11" fill="#0868D9"/><text x="361.0" y="423.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Cancel refresh</text></a><rect x="610.0" y="208" width="458.0" height="251" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="630.0" y="235" font-size="10" fill="#667080" font-weight="600" text-anchor="start">EMPTY · AGENDA AVAILABLE</text><text x="630.0" y="270" font-size="19" fill="#0868D9" font-weight="600" text-anchor="start">No upcoming practice</text><text x="630.0" y="309" font-size="14" fill="#667080" font-weight="400" text-anchor="start">No practice reservation appears in the checked agenda. Your daily</text><text x="630.0" y="330" font-size="14" fill="#667080" font-weight="400" text-anchor="start">target is still 3 hours.</text><a href="b-assistant.svg" aria-label="Find a room"><rect x="630.0" y="397" width="418.0" height="42" rx="11" fill="#0868D9"/><text x="839.0" y="423.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Find a room</text></a><rect x="132.0" y="478" width="458.0" height="251" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="152.0" y="505" font-size="10" fill="#667080" font-weight="600" text-anchor="start">OFFLINE · CACHED DATA</text><text x="152.0" y="540" font-size="19" fill="#93620C" font-weight="600" text-anchor="start">Could not refresh</text><text x="152.0" y="579" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Showing bookings checked today at 11:42. They may have</text><text x="152.0" y="600" font-size="14" fill="#667080" font-weight="400" text-anchor="start">changed.</text><a href="b-today.svg" aria-label="Try refresh again"><rect x="152.0" y="667" width="418.0" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="361.0" y="693.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Try refresh again</text></a><rect x="610.0" y="478" width="458.0" height="251" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="630.0" y="505" font-size="10" fill="#667080" font-weight="600" text-anchor="start">UNAVAILABLE · NO CACHE</text><text x="630.0" y="540" font-size="19" fill="#B73332" font-weight="600" text-anchor="start">Agenda unavailable</text><text x="630.0" y="579" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Booked hours are unknown. Refresh to load your schedule.</text><a href="b-today.svg" aria-label="Refresh bookings"><rect x="630.0" y="667" width="418.0" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="839.0" y="693.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Refresh bookings</text></a></svg>