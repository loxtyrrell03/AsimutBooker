<text x="762" y="526" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">Keep the draft visible while refreshing.</text>
<text x="762" y="549" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">Event selection is unavailable until</text>
<text x="762" y="572" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">the complete agenda is checked.</text>
