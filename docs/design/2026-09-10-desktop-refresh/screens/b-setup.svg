<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, sans-serif"><title>B · Open canvas · Welcome to Asimut</title><desc>Design proposal. All values are invented examples. Local links navigate static mockups only.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F8FAFC"/><rect x="0" y="0" width="1200" height="34" rx="0" fill="#FFFFFF"/><text x="18" y="23" font-size="12" fill="#667080" font-weight="400" text-anchor="start">Asimut Booker</text><path d="M1086 17h12" stroke="#667080" fill="none"/><rect x="1128" y="12" width="10" height="10" rx="0" fill="#FFFFFF" stroke="#667080" stroke-width="1"/><path transform="translate(1166 8) scale(0.7916666666666666)" d="M6 6L18 18M6 18L18 6" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M0 34h1200" stroke="#E1E6EE" fill="none"/><rect x="0" y="35" width="1200" height="82" rx="0" fill="#FFFFFF"/><rect x="32" y="55" width="36" height="36" rx="11" fill="#0868D9"/><rect x="40" y="71" width="4" height="11" rx="2" fill="#FFFFFF"/><rect x="47" y="61" width="4" height="21" rx="2" fill="#FFFFFF"/><rect x="54" y="67" width="4" height="15" rx="2" fill="#FFFFFF"/><text x="80" y="79" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Asimut</text><a href="b-today.svg" aria-label="Today"><text x="487" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">Today</text></a><a href="b-week.svg" aria-label="My Week"><text x="611" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">My Week</text></a><a href="b-calendar.svg" aria-label="Calendar"><text x="735" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">Calendar</text></a><a href="b-assistant.svg" aria-label="Assistant"><text x="859" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">Assistant</text></a><a href="b-settings.svg" aria-label="Settings"><rect x="926" y="56" width="114" height="42" rx="12" fill="#EAF3FF"/><text x="983" y="82" font-size="14" fill="#0868D9" font-weight="600" text-anchor="middle">Settings</text></a><path d="M0 117h1200" stroke="#E1E6EE" fill="none"/><text x="132" y="150" font-size="32" fill="#1D2430" font-weight="600" text-anchor="start">Welcome to Asimut</text><text x="132" y="180" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Connect your college account to get started.</text><path d="M132 756h936" stroke="#E1E6EE" fill="none"/><text x="132" y="780" font-size="11" fill="#667080" font-weight="400" text-anchor="start">B · Open canvas   /   Design preview · invented example data</text><rect x="132" y="208" width="660" height="340" rx="24" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><rect x="160" y="234" width="36" height="36" rx="11" fill="#0868D9"/><rect x="168" y="250" width="4" height="11" rx="2" fill="#FFFFFF"/><rect x="175" y="240" width="4" height="21" rx="2" fill="#FFFFFF"/><rect x="182" y="246" width="4" height="15" rx="2" fill="#FFFFFF"/><text x="208" y="258" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Asimut</text><text x="160" y="313" font-size="28" fill="#1D2430" font-weight="600" text-anchor="start">Your practice, in one place.</text><text x="160" y="354" font-size="16" fill="#667080" font-weight="400" text-anchor="start">First, check your saved college sign-in. You can then choose your practice days, times</text><text x="160" y="377" font-size="16" fill="#667080" font-weight="400" text-anchor="start">and rooms.</text><a href="b-run.svg" aria-label="Check saved sign-in"><rect x="160" y="434" width="604" height="42" rx="11" fill="#0868D9"/><text x="462.0" y="460.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Check saved sign-in</text></a><a href="b-recovery.svg" aria-label="Keep your place"><text x="160" y="518" font-size="14" fill="#0868D9" font-weight="400" text-anchor="start">Sign-in needs attention? Repair connection</text></a><rect x="132" y="576" width="660" height="106" rx="14" fill="#EAF3FF"/><text x="150" y="604" font-size="16" fill="#0868D9" font-weight="600" text-anchor="start">Secure setup on this PC</text><text x="150" y="628" font-size="14" fill="#0868D9" font-weight="400" text-anchor="start">If credentials are missing, open the masked Windows setup prompt. Passwords are never entered in</text><text x="150" y="649" font-size="14" fill="#0868D9" font-weight="400" text-anchor="start">this page.</text><rect x="132" y="707" width="192" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="228.0" y="733.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Open secure setup</text></svg>