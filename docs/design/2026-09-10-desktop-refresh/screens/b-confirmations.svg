<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, sans-serif"><title>B · Open canvas · Confirm an action</title><desc>Design proposal. All values are invented examples. Local links navigate static mockups only.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F8FAFC"/><rect x="0" y="0" width="1200" height="34" rx="0" fill="#FFFFFF"/><text x="18" y="23" font-size="12" fill="#667080" font-weight="400" text-anchor="start">Asimut Booker</text><path d="M1086 17h12" stroke="#667080" fill="none"/><rect x="1128" y="12" width="10" height="10" rx="0" fill="#FFFFFF" stroke="#667080" stroke-width="1"/><path transform="translate(1166 8) scale(0.7916666666666666)" d="M6 6L18 18M6 18L18 6" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M0 34h1200" stroke="#E1E6EE" fill="none"/><rect x="0" y="35" width="1200" height="82" rx="0" fill="#FFFFFF"/><rect x="32" y="55" width="36" height="36" rx="11" fill="#0868D9"/><rect x="40" y="71" width="4" height="11" rx="2" fill="#FFFFFF"/><rect x="47" y="61" width="4" height="21" rx="2" fill="#FFFFFF"/><rect x="54" y="67" width="4" height="15" rx="2" fill="#FFFFFF"/><text x="80" y="79" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Asimut</text><a href="b-today.svg" aria-label="Today"><text x="487" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">Today</text></a><a href="b-week.svg" aria-label="My Week"><text x="611" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">My Week</text></a><a href="b-calendar.svg" aria-label="Calendar"><text x="735" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">Calendar</text></a><a href="b-assistant.svg" aria-label="Assistant"><text x="859" y="82" font-size="14" fill="#667080" font-weight="400" text-anchor="middle">Assistant</text></a><a href="b-settings.svg" aria-label="Settings"><rect x="926" y="56" width="114" height="42" rx="12" fill="#EAF3FF"/><text x="983" y="82" font-size="14" fill="#0868D9" font-weight="600" text-anchor="middle">Settings</text></a><path d="M0 117h1200" stroke="#E1E6EE" fill="none"/><text x="132" y="150" font-size="32" fill="#1D2430" font-weight="600" text-anchor="start">Confirm an action</text><text x="132" y="180" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Settings</text><path d="M132 756h936" stroke="#E1E6EE" fill="none"/><text x="132" y="780" font-size="11" fill="#667080" font-weight="400" text-anchor="start">B · Open canvas   /   Design preview · invented example data</text><rect x="132.0" y="208" width="304.0" height="350" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="152.0" y="248" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Remove schedule?</text><text x="152.0" y="299" font-size="15" fill="#667080" font-weight="400" text-anchor="start">Automatic runs will stop. Existing</text><text x="152.0" y="321" font-size="15" fill="#667080" font-weight="400" text-anchor="start">reservations and saved preferences stay</text><text x="152.0" y="343" font-size="15" fill="#667080" font-weight="400" text-anchor="start">in place.</text><a href="b-system.svg" aria-label="Keep unchanged"><rect x="152.0" y="444" width="264.0" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="284.0" y="470.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Keep unchanged</text></a><a href="b-system.svg" aria-label="Remove schedule"><rect x="152.0" y="500" width="264.0" height="42" rx="11" fill="#B73332"/><text x="284.0" y="526.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Remove schedule</text></a><rect x="448.0" y="208" width="304.0" height="350" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="468.0" y="248" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Clear saved history?</text><text x="468.0" y="299" font-size="15" fill="#667080" font-weight="400" text-anchor="start">Saved run history will be removed. This</text><text x="468.0" y="321" font-size="15" fill="#667080" font-weight="400" text-anchor="start">does not cancel any reservations.</text><a href="b-activity.svg" aria-label="Keep unchanged"><rect x="468.0" y="444" width="264.0" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="600.0" y="470.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Keep unchanged</text></a><a href="b-activity.svg" aria-label="Clear history"><rect x="468.0" y="500" width="264.0" height="42" rx="11" fill="#B73332"/><text x="600.0" y="526.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Clear history</text></a><rect x="764.0" y="208" width="304.0" height="350" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="784.0" y="248" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Remove old log files?</text><text x="784.0" y="299" font-size="15" fill="#667080" font-weight="400" text-anchor="start">3 selected inactive logs, older than 48</text><text x="784.0" y="321" font-size="15" fill="#667080" font-weight="400" text-anchor="start">hours, will be removed. Active and</text><text x="784.0" y="343" font-size="15" fill="#667080" font-weight="400" text-anchor="start">recent logs stay.</text><a href="b-tools.svg" aria-label="Keep unchanged"><rect x="784.0" y="444" width="264.0" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="916.0" y="470.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Keep unchanged</text></a><a href="b-tools.svg" aria-label="Remove 3 files"><rect x="784.0" y="500" width="264.0" height="42" rx="11" fill="#B73332"/><text x="916.0" y="526.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Remove 3 files</text></a><rect x="132" y="597" width="936" height="106" rx="14" fill="#EAF3FF"/><text x="150" y="625" font-size="16" fill="#0868D9" font-weight="600" text-anchor="start">Other explicit decisions</text><text x="150" y="649" font-size="14" fill="#0868D9" font-weight="400" text-anchor="start">Ignoring an event permits overlapping practice. Reopening protected time permits future bookings; it never restores a cancelled booking.</text></svg>