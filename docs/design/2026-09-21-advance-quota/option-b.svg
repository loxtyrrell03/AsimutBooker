<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1550" viewBox="0 0 1500 1550">
<rect width="1500" height="1550" fill="#f8fafc"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1d2430} .muted{fill:#667080} .blue{fill:#0868d9}</style>
<text x="34" y="44" font-size="29" class="" font-weight="600">B · Guided setup</text>
<text x="34" y="75" font-size="17" class="muted" font-weight="400">A four-step flow for choosing rooms, periods, distribution and a final review.</text>
<text x="34" y="101" font-size="14" class="muted" font-weight="400">DESIGN PROPOSAL · All bookings, balances and availability below are invented examples.</text>
<rect x="28" y="125" width="1010" height="680" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="55" y="167" font-size="22" class="" font-weight="600">Asimut</text>
<text x="350" y="167" font-size="16" class="blue" font-weight="400">Today      My Week      Calendar      Assistant      Settings</text>
<text x="68" y="225" font-size="30" class="" font-weight="600">Advance quota</text>
<text x="68" y="255" font-size="16" class="muted" font-weight="400">Use your rolling allowance for the practice that matters most.</text>
<text x="68" y="299" font-size="19" class="blue" font-weight="600">1 Rooms  →  2 Periods  →  3 Distribution  →  4 Review</text>
<text x="68" y="355" font-size="22" class="" font-weight="600">How would you like to use the six hours?</text>
<rect x="68" y="389" width="895" height="66" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="86" y="417" font-size="18" class="" font-weight="600">Spread across days</text>
<text x="86" y="441" font-size="15" class="muted" font-weight="400">Secure a useful block on as many practice days as possible.</text>
<rect x="68" y="470" width="895" height="66" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="86" y="498" font-size="18" class="" font-weight="600">Fewer, longer sessions</text>
<text x="86" y="522" font-size="15" class="muted" font-weight="400">Concentrate the allowance into fewer days.</text>
<rect x="68" y="551" width="895" height="66" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="86" y="579" font-size="18" class="" font-weight="600">Custom day priorities</text>
<text x="86" y="603" font-size="15" class="muted" font-weight="400">Give selected days a larger share; set individual limits.</text>
<text x="68" y="670" font-size="16" class="muted" font-weight="400">All controls stay available when revisiting any step.</text>
<rect x="68" y="735" width="180" height="42" rx="16" fill="#eaf3ff" stroke="#e1e6ee"/>
<text x="84" y="762" font-size="16" class="blue" font-weight="400">Save changes</text>
<rect x="266" y="735" width="110" height="42" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="282" y="762" font-size="16" class="" font-weight="400">Cancel</text>
<text x="530" y="761" font-size="14" class="muted" font-weight="400">Applies to future decisions; keeps existing bookings.</text>
<rect x="1070" y="125" width="390" height="680" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="1090" y="165" font-size="21" class="" font-weight="600">Asimut</text>
<text x="1090" y="195" font-size="16" class="blue" font-weight="400">Settings  ›  Advance quota</text>
<text x="1090" y="243" font-size="27" class="" font-weight="600">Advance quota</text>
<text x="1090" y="284" font-size="17" class="blue" font-weight="400">Step 3 of 4 · Distribution</text>
<rect x="1090" y="320" width="350" height="64" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="1108" y="359" font-size="18" class="" font-weight="400">Spread across days</text>
<rect x="1090" y="400" width="350" height="64" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="1108" y="439" font-size="18" class="" font-weight="400">Fewer, longer sessions</text>
<rect x="1090" y="480" width="350" height="64" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="1108" y="519" font-size="18" class="" font-weight="400">Custom day priorities</text>
<rect x="1090" y="587" width="350" height="42" rx="16" fill="#eaf3ff" stroke="#e1e6ee"/>
<text x="1106" y="614" font-size="16" class="blue" font-weight="400">Next: review settings</text>
<rect x="1090" y="640" width="350" height="42" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="1106" y="667" font-size="16" class="" font-weight="400">Back to periods</text>
<rect x="1090" y="730" width="220" height="42" rx="16" fill="#eaf3ff" stroke="#e1e6ee"/>
<text x="1106" y="757" font-size="16" class="blue" font-weight="400">Save changes</text>
<rect x="1322" y="730" width="118" height="42" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="1338" y="757" font-size="16" class="" font-weight="400">Cancel</text>
<text x="34" y="850" font-size="25" class="" font-weight="600">Details, setup and states · shared by this proposal</text>
<rect x="28" y="878" width="710" height="191" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="50" y="912" font-size="20" class="" font-weight="600">Room detail / first setup</text>
<text x="50" y="945" font-size="15" class="muted" font-weight="400">Start with current top two rooms, or choose any allowed rooms.</text>
<text x="50" y="973" font-size="15" class="muted" font-weight="400">Rank Weston, Corus and your own alternatives with Up / Down.</text>
<text x="50" y="1001" font-size="15" class="muted" font-weight="400">Choose selected rooms only, or allow other eligible rooms.</text>
<text x="50" y="1029" font-size="15" class="muted" font-weight="400">Access restrictions and excluded rooms always apply.</text>
<rect x="756" y="878" width="710" height="191" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="778" y="912" font-size="20" class="" font-weight="600">Periods and day detail</text>
<text x="778" y="945" font-size="15" class="muted" font-weight="400">Add ranked periods, each with weekdays, start and end.</text>
<text x="778" y="973" font-size="15" class="muted" font-weight="400">Prefer these periods, or only use them for advance bookings.</text>
<text x="778" y="1001" font-size="15" class="muted" font-weight="400">Set weekday priority and an advance limit per day.</text>
<text x="778" y="1029" font-size="15" class="muted" font-weight="400">Spread evenly, weight days, concentrate, or prefer best quality.</text>
<rect x="28" y="1089" width="710" height="191" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="50" y="1123" font-size="20" class="" font-weight="600">Waiting and flexibility</text>
<text x="50" y="1156" font-size="15" class="muted" font-weight="400">Choose a preferred block and minimum daily anchor.</text>
<text x="50" y="1184" font-size="15" class="muted" font-weight="400">Wait for shorter-horizon rooms, or use open rooms now.</text>
<text x="50" y="1212" font-size="15" class="muted" font-weight="400">Optionally keep some advance minutes unallocated.</text>
<text x="50" y="1240" font-size="15" class="muted" font-weight="400">Choose when last-minute practice may spend held credit.</text>
<rect x="756" y="1089" width="710" height="191" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="778" y="1123" font-size="20" class="" font-weight="600">Help / empty / loading</text>
<text x="778" y="1156" font-size="15" class="muted" font-weight="400">? explains rolling credit: used sessions return credit.</text>
<text x="778" y="1184" font-size="15" class="muted" font-weight="400">No custom periods: use existing preferred times.</text>
<text x="778" y="1212" font-size="15" class="muted" font-weight="400">No selected rooms: show inline error; retain the draft.</text>
<text x="778" y="1240" font-size="15" class="muted" font-weight="400">Loading settings…  Cancel remains available.</text>
<rect x="28" y="1300" width="710" height="191" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="50" y="1334" font-size="20" class="" font-weight="600">Saving / errors / cancellation</text>
<text x="50" y="1367" font-size="15" class="muted" font-weight="400">Saving… prevents a duplicate submission.</text>
<text x="50" y="1395" font-size="15" class="muted" font-weight="400">Invalid period: show the error beside its times.</text>
<text x="50" y="1423" font-size="15" class="muted" font-weight="400">Changed elsewhere: Reload settings before saving again.</text>
<text x="50" y="1451" font-size="15" class="muted" font-weight="400">Cancel discards this editor draft; reservations stay intact.</text>
<rect x="756" y="1300" width="710" height="191" rx="16" fill="#fff" stroke="#e1e6ee"/>
<text x="778" y="1334" font-size="20" class="" font-weight="600">Confirmation / live preview</text>
<text x="778" y="1367" font-size="15" class="muted" font-weight="400">Saved. Future booking decisions use these settings.</text>
<text x="778" y="1395" font-size="15" class="muted" font-weight="400">My Week labels intentions separately from confirmed bookings.</text>
<text x="778" y="1423" font-size="15" class="muted" font-weight="400">Room opens in 5 days: show its actual unlock, not a promise.</text>
<text x="778" y="1451" font-size="15" class="muted" font-weight="400">Unavailable credit or slots: explain the remaining shortfall.</text>
</svg>