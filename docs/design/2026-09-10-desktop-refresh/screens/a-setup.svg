<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, sans-serif"><title>A · Quiet desktop · Welcome to Asimut</title><desc>Design proposal. All values are invented examples. Local links navigate static mockups only.</desc><rect x="0" y="0" width="1200" height="800" rx="0" fill="#F8FAFC"/><rect x="0" y="0" width="1200" height="34" rx="0" fill="#FFFFFF"/><text x="18" y="23" font-size="12" fill="#667080" font-weight="400" text-anchor="start">Asimut Booker</text><path d="M1086 17h12" stroke="#667080" fill="none"/><rect x="1128" y="12" width="10" height="10" rx="0" fill="#FFFFFF" stroke="#667080" stroke-width="1"/><path transform="translate(1166 8) scale(0.7916666666666666)" d="M6 6L18 18M6 18L18 6" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M0 34h1200" stroke="#E1E6EE" fill="none"/><rect x="0" y="35" width="200" height="765" rx="0" fill="#FFFFFF"/><rect x="24" y="62" width="36" height="36" rx="11" fill="#0868D9"/><rect x="32" y="78" width="4" height="11" rx="2" fill="#FFFFFF"/><rect x="39" y="68" width="4" height="21" rx="2" fill="#FFFFFF"/><rect x="46" y="74" width="4" height="15" rx="2" fill="#FFFFFF"/><text x="72" y="86" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Asimut</text><a href="a-today.svg" aria-label="Today"><path transform="translate(26 147) scale(0.875)" d="M3 10L12 3L21 10V21H15V14H9V21H3Z" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="61" y="163" font-size="15" fill="#667080" font-weight="400" text-anchor="start">Today</text></a><a href="a-week.svg" aria-label="My Week"><path transform="translate(26 205) scale(0.875)" d="M9 6H21M9 12H21M9 18H21M3 6H4M3 12H4M3 18H4" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="61" y="221" font-size="15" fill="#667080" font-weight="400" text-anchor="start">My Week</text></a><a href="a-calendar.svg" aria-label="Calendar"><path transform="translate(26 263) scale(0.875)" d="M5 5H19Q21 5 21 7V20H3V7Q3 5 5 5M7 3V7M17 3V7M3 10H21M7 14H9M15 14H17M7 17H9" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="61" y="279" font-size="15" fill="#667080" font-weight="400" text-anchor="start">Calendar</text></a><a href="a-assistant.svg" aria-label="Assistant"><path transform="translate(26 321) scale(0.875)" d="M4 4H20V17H10L4 21Z" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="61" y="337" font-size="15" fill="#667080" font-weight="400" text-anchor="start">Assistant</text></a><a href="a-settings.svg" aria-label="Settings"><rect x="12" y="668" width="176" height="46" rx="13" fill="#EAF3FF"/><path transform="translate(26 681) scale(0.875)" d="M3 6H8M12 6H21M3 12H15M19 12H21M3 18H5M9 18H21M8 3V9M15 9V15M5 15V21" stroke="#0868D9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="61" y="697" font-size="15" fill="#0868D9" font-weight="600" text-anchor="start">Settings</text></a><text x="26" y="580" font-size="10" fill="#667080" font-weight="600" text-anchor="start">AUTO-BOOKING</text><rect x="26" y="597" width="6" height="6" rx="3" fill="#2B805B"/><text x="40" y="605" font-size="12" fill="#667080" font-weight="400" text-anchor="start">On · next 12:13</text><path d="M200 35V800" stroke="#E1E6EE"/><text x="232" y="120" font-size="32" fill="#1D2430" font-weight="600" text-anchor="start">Welcome to Asimut</text><text x="232" y="150" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Connect your college account to get started.</text><path d="M232 756h928" stroke="#E1E6EE" fill="none"/><text x="232" y="780" font-size="11" fill="#667080" font-weight="400" text-anchor="start">A · Quiet desktop   /   Design preview · invented example data</text><rect x="232" y="178" width="660" height="340" rx="24" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><rect x="260" y="204" width="36" height="36" rx="11" fill="#0868D9"/><rect x="268" y="220" width="4" height="11" rx="2" fill="#FFFFFF"/><rect x="275" y="210" width="4" height="21" rx="2" fill="#FFFFFF"/><rect x="282" y="216" width="4" height="15" rx="2" fill="#FFFFFF"/><text x="308" y="228" font-size="20" fill="#1D2430" font-weight="600" text-anchor="start">Asimut</text><text x="260" y="283" font-size="28" fill="#1D2430" font-weight="600" text-anchor="start">Your practice, in one place.</text><text x="260" y="324" font-size="16" fill="#667080" font-weight="400" text-anchor="start">First, check your saved college sign-in. You can then choose your practice days, times</text><text x="260" y="347" font-size="16" fill="#667080" font-weight="400" text-anchor="start">and rooms.</text><a href="a-run.svg" aria-label="Check saved sign-in"><rect x="260" y="404" width="604" height="42" rx="11" fill="#0868D9"/><text x="562.0" y="430.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Check saved sign-in</text></a><a href="a-recovery.svg" aria-label="Keep your place"><text x="260" y="488" font-size="14" fill="#0868D9" font-weight="400" text-anchor="start">Sign-in needs attention? Repair connection</text></a><rect x="232" y="546" width="660" height="106" rx="14" fill="#EAF3FF"/><text x="250" y="574" font-size="16" fill="#0868D9" font-weight="600" text-anchor="start">Secure setup on this PC</text><text x="250" y="598" font-size="14" fill="#0868D9" font-weight="400" text-anchor="start">If credentials are missing, open the masked Windows setup prompt. Passwords are never entered in</text><text x="250" y="619" font-size="14" fill="#0868D9" font-weight="400" text-anchor="start">this page.</text><rect x="232" y="677" width="192" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="328.0" y="703.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Open secure setup</text></svg>