rt">My Week</text></a><a href="a-calendar.svg" aria-label="Calendar"><path transform="translate(26 263) scale(0.875)" d="M5 5H19Q21 5 21 7V20H3V7Q3 5 5 5M7 3V7M17 3V7M3 10H21M7 14H9M15 14H17M7 17H9" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="61" y="279" font-size="15" fill="#667080" font-weight="400" text-anchor="start">Calendar</text></a><a href="a-assistant.svg" aria-label="Assistant"><path transform="translate(26 321) scale(0.875)" d="M4 4H20V17H10L4 21Z" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="61" y="337" font-size="15" fill="#667080" font-weight="400" text-anchor="start">Assistant</text></a><a href="a-settings.svg" aria-label="Settings"><rect x="12" y="668" width="176" height="46" rx="13" fill="#EAF3FF"/><path transform="translate(26 681) scale(0.875)" d="M3 6H8M12 6H21M3 12H15M19 12H21M3 18H5M9 18H21M8 3V9M15 9V15M5 15V21" stroke="#0868D9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="61" y="697" font-size="15" fill="#0868D9" font-weight="600" text-anchor="start">Settings</text></a><text x="26" y="580" font-size="10" fill="#667080" font-weight="600" text-anchor="start">AUTO-BOOKING</text><rect x="26" y="597" width="6" height="6" rx="3" fill="#2B805B"/><text x="40" y="605" font-size="12" fill="#667080" font-weight="400" text-anchor="start">On · next 12:13</text><path d="M200 35V800" stroke="#E1E6EE"/><text x="232" y="120" font-size="32" fill="#1D2430" font-weight="600" text-anchor="start">Loading, empty &amp; offline</text><text x="232" y="150" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Settings</text><path d="M232 756h928" stroke="#E1E6EE" fill="none"/><text x="232" y="780" font-size="11" fill="#667080" font-weight="400" text-anchor="start">A · Quiet desktop   /   Design preview · invented example data</text><rect x="232.0" y="178" width="454.0" height="251" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="252.0" y="205" font-size="10" fill="#667080" font-weight="600" text-anchor="start">LOADING</text><text x="252.0" y="240" font-size="19" fill="#0868D9" font-weight="600" text-anchor="start">Checking your bookings…</text><text x="252.0" y="279" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Your last checked bookings remain visible while this refresh runs.</text><a href="a-today.svg" aria-label="Cancel refresh"><rect x="252.0" y="367" width="414.0" height="42" rx="11" fill="#0868D9"/><text x="459.0" y="393.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Cancel refresh</text></a><rect x="706.0" y="178" width="454.0" height="251" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="726.0" y="205" font-size="10" fill="#667080" font-weight="600" text-anchor="start">EMPTY · AGENDA AVAILABLE</text><text x="726.0" y="240" font-size="19" fill="#0868D9" font-weight="600" text-anchor="start">No upcoming practice</text><text x="726.0" y="279" font-size="14" fill="#667080" font-weight="400" text-anchor="start">No practice reservation appears in the checked agenda. Your daily</text><text x="726.0" y="300" font-size="14" fill="#667080" font-weight="400" text-anchor="start">target is still 3 hours.</text><a href="a-assistant.svg" aria-label="Find a room"><rect x="726.0" y="367" width="414.0" height="42" rx="11" fill="#0868D9"/><text x="933.0" y="393.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Find a room</text></a><rect x="232.0" y="448" width="454.0" height="251" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="252.0" y="475" font-size="10" fill="#667080" font-weight="600" text-anchor="start">OFFLINE · CACHED DATA</text><text x="252.0" y="510" font-size="19" fill="#93620C" font-weight="600" text-anchor="start">Could not refresh</text><text x="252.0" y="549" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Showing bookings checked today at 11:42. They may have</text><text x="252.0" y="570" font-size="14" fill="#667080" font-weight="400" text-anchor="start">changed.</text><a href="a-today.svg" aria-label="Try refresh again"><rect x="252.0" y="637" width="414.0" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="459.0" y="663.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Try refresh again</text></a><rect x="706.0" y="448" width="454.0" height="251" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="726.0" y="475" font-size="10" fill="#667080" font-weight="600" text-anchor="start">UNAVAILABLE · NO CACHE</text><text x="726.0" y="510" font-size="19" fill="#B73332" font-weight="600" text-anchor="start">Agenda unavailable</text><text x="726.0" y="549" font-size="14" fill="#667080" font-weight="400" text-anchor="start">Booked hours are unknown. Refresh to load your schedule.</text><a href="a-today.svg" aria-label="Refresh bookings"><rect x="726.0" y="637" width="414.0" height="42" rx="11" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1"/><text x="933.0" y="663.0" font-size="14" fill="#1D2430" font-weight="600" text-anchor="middle">Refresh bookings</text></a></svg>