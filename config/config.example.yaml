# AsimutBooker configuration
# Copy this file to config.yaml only when you want to override the built-in
# RWCMD rule overrides. Room order, exclusions, requirements, minimum block,
# fragmentation, per-day hours, disabled dates, time preferences, and booking
# strategy are configured in the desktop app instead. Room booking horizons
# are always refreshed from Asimut and cannot be configured here.

rules:
  rolling_quota: 28
  same_room_gap_minutes: 60
  peak_hours:
    start: "09:00"
    end: "16:00"
    max_hours: 2
