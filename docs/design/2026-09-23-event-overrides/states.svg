<text x="42" y="257" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">Saved overrides: 1 event · View</text>
<text x="42" y="280" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">Choose events only if you will skip them.</text>
