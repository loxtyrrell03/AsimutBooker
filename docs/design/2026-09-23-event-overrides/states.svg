<text x="42" y="526" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">Performance workshop · Wed 23 Sep</text>
<text x="42" y="549" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">14:00–15:30 · Studio 1</text>
<text x="42" y="572" font-size="13" font-weight="400" fill="#667080" text-anchor="start" data-max-width="302">Saving queues an automatic check.</text>
