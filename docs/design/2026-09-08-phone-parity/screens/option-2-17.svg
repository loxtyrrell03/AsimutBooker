<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><title>Combined calendar / screen 17 — invented example data, proposed interface</title><rect x="0" y="0" width="390" height="844" rx="24" fill="#f8fafc" stroke="#e1e6ee"/><text x="20" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1d2430" font-weight="600" text-anchor="start">9:41</text><text x="370" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#667080" font-weight="400" text-anchor="end">EXAMPLE</text><rect x="20" y="47" width="30" height="30" rx="9" fill="#0868d9" stroke="#0868d9"/><rect x="28" y="60" width="3" height="9" rx="1" fill="white" stroke="white"/><rect x="34" y="51" width="3" height="18" rx="1" fill="white" stroke="white"/><rect x="40" y="56" width="3" height="13" rx="1" fill="white" stroke="white"/><text x="60" y="67" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#1d2430" font-weight="600" text-anchor="start">Asimut</text><text x="370" y="67" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#667080" font-weight="400" text-anchor="end">Connected</text><text x="20" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#1d2430" font-weight="600" text-anchor="start">Run booker</text><rect x="1" y="754" width="388" height="89" rx="0" fill="white" stroke="#e1e6ee"/><g transform="translate(44.75 769) scale(.85)" fill="none" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m2 10 10-8 10 8v11H7V10h10v11"/></g><text x="54.75" y="808" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#667080" font-weight="400" text-anchor="middle">Today</text><g transform="translate(138.25 769) scale(.85)" fill="none" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="17" rx="3"/><path d="M7 2v6M17 2v6M3 11h18M7 15h3M14 15h3"/></g><text x="148.25" y="808" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#667080" font-weight="400" text-anchor="middle">Calendar</text><g transform="translate(231.75 769) scale(.85)" fill="none" stroke="#667080" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9H3l1-5a9 9 0 1 1 17-4Z"/><path d="M7 9h10M7 14h6"/></g><text x="241.75" y="808" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#667080" font-weight="400" text-anchor="middle">Assistant</text><rect x="288.5" y="762" width="93.5" height="58" rx="12" fill="#eaf3ff" stroke="#eaf3ff"/><g transform="translate(325.25 769) scale(.85)" fill="none" stroke="#0868d9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 17h18"/><circle cx="8" cy="7" r="3" fill="white"/><circle cx="16" cy="17" r="3" fill="white"/></g><text x="335.25" y="808" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#0868d9" font-weight="600" text-anchor="middle">Settings</text><rect x="145.0" y="832" width="100" height="4" rx="2" fill="#1d2430" stroke="#1d2430"/><text x="20" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#1d2430" font-weight="600" text-anchor="start">Run mode</text><text x="364" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#0868d9" font-weight="600" text-anchor="start">?</text><rect x="20" y="168" width="350" height="44" rx="12" fill="white" stroke="#e1e6ee"/><text x="34" y="196" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#1d2430" font-weight="400" text-anchor="start">In background  ▾</text><text x="20" y="240" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667080" font-weight="400" text-anchor="start">Also available: show browser on the PC.</text><rect x="20" y="252" width="350" height="91" rx="12" fill="#eaf3ff" stroke="#e1e6ee"/><text x="32" y="278" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#1d2430" font-weight="600" text-anchor="start">Book using saved preferences</text><text x="32" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667080" font-weight="400" text-anchor="start">This can create reservations. Only eligible</text><text x="32" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667080" font-weight="400" text-anchor="start">dates and rooms will be attempted.</text><rect x="20" y="355" width="350" height="46" rx="12" fill="#0868d9" stroke="#e1e6ee"/><text x="195.0" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="white" font-weight="600" text-anchor="middle">Start booking run</text><text x="20" y="438" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#1d2430" font-weight="600" text-anchor="start">Example: run in progress</text><rect x="20" y="450" width="350" height="71" rx="12" fill="#eaf3ff" stroke="#e1e6ee"/><text x="32" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#1d2430" font-weight="600" text-anchor="start">Checking room availability</text><text x="32" y="501" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667080" font-weight="400" text-anchor="start">Agenda checked · scanning selected dates</text><rect x="20" y="533" width="350" height="46" rx="12" fill="white" stroke="#e1e6ee"/><text x="195.0" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#1d2430" font-weight="600" text-anchor="middle">Stop this run</text><text x="20" y="604" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667080" font-weight="400" text-anchor="start">If a save has started, its result is checked</text><text x="20" y="624" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#667080" font-weight="400" text-anchor="start">before the run finishes.</text></svg>